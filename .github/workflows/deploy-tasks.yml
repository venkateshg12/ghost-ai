name: Deploy AI tasks

on:
  push:
    branches: [main]
    paths: ["apps/server/**", "packages/types/**", "pnpm-lock.yaml"]
  workflow_dispatch:

concurrency:
  group: deploy-tasks
  cancel-in-progress: false   # never cancel a deploy half way

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production    # lets you require a manual approval in repo settings
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
      NVIDIA_RPM: ${{ secrets.NVIDIA_RPM }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
      AI_PROVIDER_ORDER: ${{ secrets.AI_PROVIDER_ORDER }}
      AI_TIMEOUT_MS: ${{ secrets.AI_TIMEOUT_MS }}
      AI_NVIDIA_TIMEOUT_MS: ${{ secrets.AI_NVIDIA_TIMEOUT_MS }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      CLIENT_URL: ${{ secrets.CLIENT_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}

      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/types build
      - name: Deploy tasks
        working-directory: apps/server
        run: npx trigger.dev@4.7.3 deploy
